# CodeQL code scanning (advanced setup). Results appear under Security > Code scanning.
# The repository's CodeQL "default setup" must stay off, or uploads from this workflow are
# rejected (docs/ci.md).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wednesdays 04:23 UTC: new queries find old code.
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the SARIF results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python # src/, tests/, scripts/
            build-mode: none
          - language: javascript-typescript # the offline authoring tool, tools/author/
            build-mode: none
          - language: actions # the workflows in .github/workflows/
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
