# Categories for the release notes that GitHub generates (gh release create --generate-notes).
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Benchmark data
      labels: [data]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
